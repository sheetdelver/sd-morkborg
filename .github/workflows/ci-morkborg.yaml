name: Validate Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Main and tag pushes at the same commit take turns; the second reuses the first.
concurrency:
  group: validation-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI_CORE_REF: 'v0.19.3'
      SHEET_DELVER_DATA: ${{ github.workspace }}/sheet-delver-core/.module-ci-data
    defaults:
      run:
        working-directory: sheet-delver-core
    steps:
      - name: Check out pinned Sheet Delver toolchain
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: sheetdelver/sheetdelver
          ref: v0.19.3
          path: sheet-delver-core
          persist-credentials: false

      - name: Check out module source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sheet-delver-core/.module-ci-data/local/modules/morkborg
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: sheet-delver-core/package-lock.json

      - name: Record the selected toolchain commit
        run: echo "CI_TOOLCHAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select exact or metadata-only validation reuse
        id: reuse
        working-directory: sheet-delver-core/.module-ci-data/local/modules/morkborg
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci-reuse.mjs "$RUNNER_TEMP/validated-release"

      - name: Test standalone release helper
        if: steps.reuse.outputs.reused != 'true'
        run: node --test .module-ci-data/local/modules/morkborg/scripts/*.test.mjs

      - name: Install reviewed Sheet Delver toolchain
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        run: npm ci

      - name: Generate managed configuration
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        run: npm run managed:generate

      - name: Validate module contract
        if: steps.reuse.outputs.reused != 'true'
        run: npm run module:check -- 'morkborg'

      - name: Type-check module source, UI and hooks
        if: steps.reuse.outputs.reused != 'true'
        run: node .module-ci-data/local/modules/morkborg/scripts/typecheck.mjs

      - name: Run module regression tests
        if: steps.reuse.outputs.reused != 'true'
        run: |
          for test in .module-ci-data/local/modules/morkborg/src/tests/*.test.ts; do
            npx tsx "$test" || exit 1
          done

      - name: Verify distributable package
        if: steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true'
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./.module-ci-data/local/modules/morkborg/info.json').version")
          npm run module:package -- 'morkborg' --release-tag "v$VERSION" \
            --repository "$REPOSITORY_URL" --changelog "$REPOSITORY_URL/releases/tag/v$VERSION"

      - name: Prepare validated publication files
        if: (steps.reuse.outputs.reused != 'true' || steps.reuse.outputs.package == 'true') && github.event_name != 'pull_request'
        run: |
          VERSION=$(node -p "require('./.module-ci-data/local/modules/morkborg/info.json').version")
          OUT="$SHEET_DELVER_DATA/dist/modules"
          BUNDLE="$RUNNER_TEMP/validated-release"
          mkdir -p "$BUNDLE"
          cp "$OUT/morkborg-$VERSION.tgz" "$OUT/morkborg-$VERSION.sha256" "$BUNDLE/"
          cp "$OUT/morkborg-$VERSION.manifest.json" "$BUNDLE/sheet-delver-manifest.json"
          npx esbuild src/scripts/tools/modules/generate-release-history.ts --bundle --platform=node --format=esm \
            --outfile="$BUNDLE/generate-release-history.mjs"

      - name: Bind files to this validation attempt
        id: bundle
        if: steps.reuse.outputs.exact != 'true' && github.event_name != 'pull_request'
        working-directory: sheet-delver-core/.module-ci-data/local/modules/morkborg
        run: node scripts/ci-artifacts.mjs record "$RUNNER_TEMP/validated-release"

      - name: Retain validated publication files
        if: steps.reuse.outputs.exact != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/validated-release/*
          if-no-files-found: error
          retention-days: 30
