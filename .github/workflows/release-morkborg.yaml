name: Release Module
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish validated package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      CI_CORE_REF: 'v0.19.3'
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Require passing validation for this exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs --verify-tag-ci

      - name: Publish the validated archive without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
